<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="lamaaulabs — lab produk &amp; software independen">
  <rect width="1200" height="630" fill="#f4f1ea"/>

  <!-- grid lines, same 100px rhythm as the site -->
  <g stroke="#efeae0">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- frame, matches the site hairline colour -->
  <rect x="30.5" y="30.5" width="1139" height="569" fill="none" stroke="#d8d2c7"/>

  <!-- brand -->
  <text x="88" y="96" font-family="Instrument Serif, serif" font-size="34" fill="#1a1815">lamaau<tspan fill="#c4421a" font-style="italic">labs</tspan></text>

  <!-- eyebrow -->
  <text x="88" y="196" font-family="JetBrains Mono, ui-monospace, monospace" font-size="19" letter-spacing="2.2" fill="#c4421a">LAB PRODUK INDEPENDEN — INDONESIA</text>

  <!-- headline -->
  <text font-family="Instrument Serif, serif" font-size="100" letter-spacing="-2" fill="#1a1815">
    <tspan x="86" y="300">Kita bangun produk</tspan>
    <tspan x="86" y="402">sendiri. Lalu bantu</tspan>
    <tspan x="86" y="504">bangun <tspan fill="#c4421a" font-style="italic">punyamu</tspan>.</tspan>
  </text>

  <!-- rule -->
  <line x1="88" y1="556" x2="1112" y2="556" stroke="#d8d2c7"/>

  <!-- footer -->
  <text x="88" y="590" font-family="JetBrains Mono, ui-monospace, monospace" font-size="17" letter-spacing="1.2" fill="#6b6560">lamaaulabs.com</text>
  <text x="1112" y="590" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="17" letter-spacing="1.2" fill="#6b6560">WEB · API · DATABASE · DEPLOY</text>
</svg>
